[package]
name = "openacmi"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

build = "build.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
acmi-core.workspace = true
acmi-io.workspace = true
acmi-render.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
glam.workspace = true
image.workspace = true
log.workspace = true
rfd.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
# The updater: fetching a release, checking its hash and unpacking it.
sha2.workspace = true
toml.workspace = true
ureq.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
# File associations: the registry, and telling Explorer about the change.
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
